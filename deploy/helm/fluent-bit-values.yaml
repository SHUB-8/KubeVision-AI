# Fluent Bit -> Loki single binary (auth_enabled=false).
#
# Label_Keys promotes Kubernetes filter metadata into stream labels; the
# resulting label names are the record key suffixes (documented behaviour):
#   job="fluentbit", namespace_name, pod_name, container_name
# The backend's LogQL selectors (internal/clients/loki) use those key names.
# Auto_Kubernetes_Labels is deliberately NOT used: it promotes pod OBJECT
# labels (chart, pod_template_hash, ...) and bloats stream cardinality.
config:
  outputs: |
    [OUTPUT]
        Name loki
        Match kube.*
        Host loki.monitoring.svc.cluster.local
        Port 3100
        Labels job=fluentbit
        Label_Keys $kubernetes['namespace_name'],$kubernetes['pod_name'],$kubernetes['container_name']
