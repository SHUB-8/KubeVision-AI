---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: beyla
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: beyla
rules:
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services", "nodes"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: beyla
subjects:
  - kind: ServiceAccount
    name: beyla
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: beyla
---
apiVersion: v1
kind: Service
metadata:
  name: beyla
  namespace: monitoring
  labels:
    app: beyla
spec:
  selector:
    app: beyla
  ports:
    - name: metrics
      port: 8999
      targetPort: 8999
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: beyla
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: beyla
  endpoints:
    - port: metrics
      interval: 15s
      # Preserve the per-process instance identifiers Beyla sets itself
      honorLabels: true
---
# Beyla 3.x only starts Application Observability mode when at least one
# process-selection criterion is set (BEYLA_OPEN_PORT, BEYLA_AUTO_TARGET_EXE,
# or discovery selectors - see Config.appO11yEnabled in the Beyla source).
# Env vars can't express the services list, so selection lives in this file.
#
# Instrumentation coverage: Beyla instruments every supported language on its
# own - no SDK injection required. Verified on this cluster: 12/12 boutique
# services report RED metrics (Go, Python, Node, .NET and Java alike).
# Go is instrumented with uprobes; every other runtime goes through the generic
# network tracer, which attaches kprobes BY KERNEL SYMBOL NAME.
#
# HOST REQUIREMENT (this is what silently breaks non-Go coverage):
# kernels built with Clang LTO/ThinLTO mangle internal symbol names, so a
# Required kprobe such as `unix_stream_recvmsg` cannot attach and Beyla aborts
# the ENTIRE generic tracer. Go services keep reporting while every non-Go
# service goes dark - with no error surfaced anywhere in the UI.
# Observed on CachyOS `linux-cachyos` >= 6.11.2 (ThinLTO default since Oct 2024);
# its GCC-built `linux-cachyos-lts` / `linux-cachyos-gcc` variants are unaffected.
#
# Preflight before trusting any new node (all three must pass):
#   test -f /sys/kernel/btf/vmlinux                                              # BTF required (CO-RE)
#   grep -cE ' (unix_stream_recvmsg|__x64_unix_stream_recvmsg)$' /proc/kallsyms  # 0 => LTO => non-Go dead
#   cat /sys/kernel/security/lockdown                                            # must show [none]
apiVersion: v1
kind: ConfigMap
metadata:
  name: beyla-config
  namespace: monitoring
data:
  beyla-config.yml: |
    discovery:
      instrument:
        - k8s_namespace: boutique
    routes:
      unmatched: heuristic
      ignore_mode: all
      ignored_patterns:
        - /_healthz
        - /healthz
        - /health
        - /live
        - /ready
        - /grpc.health.v1.Health/*
        - /grpc.health.v1.Health/Check
        - .*health.*
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: beyla
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: beyla
  template:
    metadata:
      labels:
        app: beyla
    spec:
      hostPID: true
      hostNetwork: true
      serviceAccountName: beyla
      # Use ClusterFirstWithHostNet so the hostNetwork pod automatically uses
      # the in-cluster DNS resolver across any provider (K3s, EKS, GKE, AKS, bare-metal).
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: beyla
          image: grafana/beyla:3.33.0
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
          env:
            # Prometheus scrape endpoint (scraped via the ServiceMonitor below)
            - name: BEYLA_PROMETHEUS_PORT
              value: "8999"
            # Metric groups: RED metrics, span metrics, service graph, network flows
            # https://grafana.com/docs/beyla/latest/configure/export-data/
            #
            # application_span is REQUIRED for application_service_graph to emit
            # anything. The graph is computed from Beyla's own generated spans, so
            # with the graph group enabled but the span group missing, the feature
            # is silently empty - no error, no warning, just zero series.
            # Verified on this cluster: 0 traces_service_graph_* families without
            # application_span, 8 families + 10 real edges with it.
            - name: BEYLA_PROMETHEUS_FEATURES
              value: "application,application_span,application_service_graph,network"
            # Trace-context propagation BETWEEN processes. Without it every
            # SDK-injected span is its own root trace: Tempo fills up with
            # single-span fragments and nothing is a real distributed trace
            # (measured 0/22 multi-service traces before, deep 6-service chains
            # after). Library-level injection into Go binaries is the part that
            # connects frontend's calls to the SDK services.
            #
            # The network-level injector is governed by Beyla itself: on kernels
            # with the FIONREAD sockhash bug (commit 929e30f93125 - observed on
            # this 6.18 LTS) it logs an ERROR and disables just that piece rather
            # than risk stalling or truncating application reads. That log line
            # is expected here, and is only detectable because /sys/kernel/tracing
            # is mounted (see volumes below).
            - name: BEYLA_BPF_CONTEXT_PROPAGATION
              value: "all"
            # Decorate metrics/traces with k8s.namespace.name / k8s.pod.name /
            # ... resource attributes. REQUIRED: the backend's PromQL filters
            # on the k8s_namespace_name label.
            - name: BEYLA_KUBE_METADATA_ENABLE
              value: "true"
            # OTLP trace export -> Tempo (traces only; metrics are scraped via Prometheus :8999)
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://tempo.monitoring.svc.cluster.local:4318/v1/traces"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            # Process selection + anything env vars can't express
            - name: BEYLA_CONFIG_PATH
              value: "/config/beyla-config.yml"
          ports:
            - containerPort: 8999
              name: metrics
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /var/run/
              name: var-run
            - mountPath: /sys/fs/bpf
              name: bpffs
            - mountPath: /sys/kernel/debug
              name: sys-debug
            # Required by the docs for the FIONREAD kernel-bug mitigation and for
            # network-level context propagation (BEYLA_BPF_CONTEXT_PROPAGATION).
            # Without them those code paths cannot run at all.
            - mountPath: /sys/fs/cgroup
              name: cgroup
            - mountPath: /sys/kernel/tracing
              name: tracefs
      volumes:
        - name: config
          configMap:
            name: beyla-config
        - name: var-run
          hostPath:
            path: /var/run/
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: sys-debug
          hostPath:
            path: /sys/kernel/debug
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
