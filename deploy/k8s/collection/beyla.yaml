---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: beyla
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: beyla
rules:
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services", "nodes"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: beyla
subjects:
  - kind: ServiceAccount
    name: beyla
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: beyla
---
apiVersion: v1
kind: Service
metadata:
  name: beyla
  namespace: monitoring
  labels:
    app: beyla
spec:
  selector:
    app: beyla
  ports:
    - name: metrics
      port: 8999
      targetPort: 8999
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: beyla
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: beyla
  endpoints:
    - port: metrics
      interval: 15s
      # Preserve the per-process instance identifiers Beyla sets itself
      honorLabels: true
---
# Beyla 3.x only starts Application Observability mode when at least one
# process-selection criterion is set (BEYLA_OPEN_PORT, BEYLA_AUTO_TARGET_EXE,
# or discovery selectors - see Config.appO11yEnabled in the Beyla source).
# Env vars can't express the services list, so selection lives in this file.
#
# Instrumentation coverage: eBPF uprobes work out of the box for Go services.
# Java/Node.js/Python/.NET processes are discovered but emit no RED metrics
# until the OTel SDK is injected into them (Beyla's SDK injector webhook or
# the OpenTelemetry Operator). Known gap for the polyglot boutique demo: only
# frontend/productcatalog/checkout/shipping (Go) report metrics today.
apiVersion: v1
kind: ConfigMap
metadata:
  name: beyla-config
  namespace: monitoring
data:
  beyla-config.yml: |
    discovery:
      instrument:
        - k8s_namespace: boutique
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: beyla
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: beyla
  template:
    metadata:
      labels:
        app: beyla
    spec:
      hostPID: true
      hostNetwork: true
      serviceAccountName: beyla
      # Use ClusterFirstWithHostNet so the hostNetwork pod automatically uses
      # the in-cluster DNS resolver across any provider (K3s, EKS, GKE, AKS, bare-metal).
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: beyla
          image: grafana/beyla:3.33.0
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
          env:
            # Prometheus scrape endpoint (scraped via the ServiceMonitor below)
            - name: BEYLA_PROMETHEUS_PORT
              value: "8999"
            # Metric groups: RED metrics, service graph metrics, network flows
            # https://grafana.com/docs/beyla/latest/configure/export-data/
            - name: BEYLA_PROMETHEUS_FEATURES
              value: "application,application_service_graph,network"
            # Decorate metrics/traces with k8s.namespace.name / k8s.pod.name /
            # ... resource attributes. REQUIRED: the backend's PromQL filters
            # on the k8s_namespace_name label.
            - name: BEYLA_KUBE_METADATA_ENABLE
              value: "true"
            # OTLP trace export -> Tempo (traces only; metrics are scraped via Prometheus :8999)
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://tempo.monitoring.svc.cluster.local:4318/v1/traces"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            # Process selection + anything env vars can't express
            - name: BEYLA_CONFIG_PATH
              value: "/config/beyla-config.yml"
          ports:
            - containerPort: 8999
              name: metrics
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /var/run/
              name: var-run
            - mountPath: /sys/fs/bpf
              name: bpffs
            - mountPath: /sys/kernel/debug
              name: sys-debug
      volumes:
        - name: config
          configMap:
            name: beyla-config
        - name: var-run
          hostPath:
            path: /var/run/
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: sys-debug
          hostPath:
            path: /sys/kernel/debug
