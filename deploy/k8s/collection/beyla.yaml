---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: beyla
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: beyla
rules:
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services", "nodes"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: beyla
subjects:
  - kind: ServiceAccount
    name: beyla
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: beyla
---
apiVersion: v1
kind: Service
metadata:
  name: beyla
  namespace: monitoring
  labels:
    app: beyla
spec:
  selector:
    app: beyla
  ports:
    - name: metrics
      port: 8999
      targetPort: 8999
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: beyla
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: beyla
  endpoints:
    - port: metrics
      interval: 15s
      # Preserve the per-process instance identifiers Beyla sets itself
      honorLabels: true
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: beyla
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: beyla
  template:
    metadata:
      labels:
        app: beyla
    spec:
      hostPID: true
      hostNetwork: true
      serviceAccountName: beyla
      containers:
        - name: beyla
          image: grafana/beyla:3.33.0
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
          env:
            # Prometheus scrape endpoint (scraped via the ServiceMonitor below)
            - name: BEYLA_PROMETHEUS_PORT
              value: "8999"
            # Metric groups: RED metrics, service graph metrics, network flows
            # https://grafana.com/docs/beyla/latest/configure/export-data/
            - name: BEYLA_PROMETHEUS_FEATURES
              value: "application,application_service_graph,network"
            # Decorate metrics/traces with k8s.namespace.name / k8s.pod.name /
            # ... resource attributes. REQUIRED: the backend's PromQL filters
            # on the k8s_namespace_name label.
            - name: BEYLA_KUBE_METADATA_ENABLE
              value: "true"
            # OTLP trace export -> Tempo. Beyla appends /v1/traces; protocol
            # (http/protobuf) is inferred from the 4318 port.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.monitoring.svc.cluster.local:4318"
          ports:
            - containerPort: 8999
              name: metrics
          volumeMounts:
            - mountPath: /var/run/
              name: var-run
            - mountPath: /sys/fs/bpf
              name: bpffs
            - mountPath: /sys/kernel/debug
              name: sys-debug
            - mountPath: /sys/kernel/security
              name: sys-security
      volumes:
        - name: var-run
          hostPath:
            path: /var/run/
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: sys-debug
          hostPath:
            path: /sys/kernel/debug
        - name: sys-security
          hostPath:
            path: /sys/kernel/security
