apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-conf
  namespace: monitoring
data:
  tempo.yaml: |
    # Tempo 3.x monolithic layout: ingester/compactor top-level sections are
    # gone; retention moved to overrides.defaults.compaction and the
    # single-binary target is explicit.
    multitenancy_enabled: false
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"
    overrides:
      defaults:
        compaction:
          # trace retention (matches the PRD default; emptyDir loses data on
          # restart regardless - mount a PV here for anything beyond dev)
          block_retention: 72h
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
    target: all
