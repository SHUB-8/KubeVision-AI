apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: obi
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: obi
  endpoints:
    - port: metrics
      interval: 15s
      # Preserve the per-process instance identifiers the exporter sets itself
      honorLabels: true
